{% extends "base.html" %}

{% block title %}
Add Customer
{% endblock %}

{% block content %}

<div class="card">

<div class="card-header bg-success text-white">
<h3>Add Customer</h3>
</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">
<label>Name</label>
<input class="form-control" name="name" required>
</div>

<div class="mb-3">
<label>Mobile</label>
<input class="form-control" name="mobile" required>
</div>

<div class="mb-3">
<label>Village</label>
<input class="form-control" name="village">
</div>

<div class="mb-3">
<label>Address</label>
<textarea class="form-control" name="address"></textarea>
</div>

<div class="mb-3">
<label>Remarks</label>
<textarea class="form-control" name="remarks"></textarea>
</div>

<button class="btn btn-success">
Save Customer
</button>

<a href="{{ url_for('customers.customer_list') }}"
class="btn btn-secondary">
Back
</a>

</form>

</div>

</div>

{% endblock %}
