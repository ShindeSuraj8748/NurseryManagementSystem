{% extends "base.html" %}

{% block title %}
Edit Customer
{% endblock %}

{% block content %}

<div class="card">

    <div class="card-header bg-warning text-dark">
        <h3>Edit Customer</h3>
    </div>

    <div class="card-body">

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Customer Name</label>
                <input
                    type="text"
                    class="form-control"
                    name="name"
                    value="{{ customer.name }}"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Mobile Number</label>
                <input
                    type="text"
                    class="form-control"
                    name="mobile"
                    value="{{ customer.mobile }}"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Village</label>
                <input
                    type="text"
                    class="form-control"
                    name="village"
                    value="{{ customer.village }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Address</label>
                <textarea
                    class="form-control"
                    name="address"
                    rows="3">{{ customer.address }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Remarks</label>
                <textarea
                    class="form-control"
                    name="remarks"
                    rows="3">{{ customer.remarks }}</textarea>
            </div>

            <button class="btn btn-warning">
                Update Customer
            </button>

            <a
                href="{{ url_for('customers.customer_list') }}"
                class="btn btn-secondary">
                Back
            </a>

        </form>

    </div>

</div>

{% endblock %}
