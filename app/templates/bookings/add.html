{% extends "base.html" %}

{% block content %}

<h2>New Booking</h2>

<form method="POST">

<label>Customer</label>

<select name="customer_id" class="form-control">

{% for c in customers %}

<option value="{{ c.id }}">
{{ c.name }}
</option>

{% endfor %}

</select>

<br>

<label>Date</label>

<input
type="date"
name="booking_date"
class="form-control"
required>

<br>

<label>Production Batch</label>

<select
name="batch_id"
class="form-control">

{% for b in batches %}

<option value="{{ b.id }}">

{{ b.plant.name }}

|

{{ b.variety.name }}

|

Available :

{{ b.available_plants }}

|

Need Import :

{{ b.shortage }}

</option>

{% endfor %}

</select>

<br>

<label>Quantity</label>

<input
type="number"
name="quantity"
class="form-control"
required>

<br>

<label>Price Per Plant</label>

<input
type="number"
step="0.01"
name="price"
class="form-control"
required>

<br>

<label>Advance</label>

<input
type="number"
step="0.01"
name="advance_amount"
value="0"
class="form-control">

<br>

<label>Remarks</label>

<textarea
name="remarks"
class="form-control">
</textarea>

<br>

<button class="btn btn-success">

Save Booking

</button>

</form>

{% endblock %}
