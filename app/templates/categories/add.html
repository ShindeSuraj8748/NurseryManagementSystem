{% extends "base.html" %}

{% block title %}
Add Category
{% endblock %}

{% block content %}

<h2>Add Category</h2>

<form method="POST">

    <div class="mb-3">

        <label class="form-label">

            Category Name

        </label>

        <input
            type="text"
            class="form-control"
            name="name"
            required>

    </div>

    <button class="btn btn-success">

        Save

    </button>

    <a
        href="{{ url_for('categories.category_list') }}"
        class="btn btn-secondary">

        Back

    </a>

</form>

{% endblock %}
