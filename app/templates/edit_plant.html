{% extends "base.html" %}

{% block title %}
Edit Plant
{% endblock %}

{% block content %}

<div class="card">

    <div class="card-header bg-warning">
        <h3>Edit Plant</h3>
    </div>

    <div class="card-body">

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Plant Name</label>
                <input class="form-control"
                       type="text"
                       name="name"
                       value="{{ plant.name }}">
            </div>

           <select class="form-select" name="category">

    {% for category in categories %}

        <option
            value="{{ category }}"
            {% if plant.category == category %}selected{% endif %}>

            {{ category }}

        </option>

    {% endfor %}

</select>

            <div class="mb-3">
                <label class="form-label">Price</label>
                <input class="form-control"
                       type="number"
                       step="0.01"
                       name="price"
                       value="{{ plant.price }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Quantity</label>
                <input class="form-control"
                       type="number"
                       name="quantity"
                       value="{{ plant.quantity }}">
            </div>

            <button class="btn btn-warning">
                Update Plant
            </button>

            <a href="{{ url_for('plants.plant_list') }}" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
