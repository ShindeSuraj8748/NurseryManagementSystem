{% extends "base.html" %}

{% block title %}
Edit Plant
{% endblock %}

{% block content %}

<div class="card">

    <div class="card-header bg-warning">
        <h3>Edit Plant</h3>
    </div>

    <div class="card-body">

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Plant Name</label>
                <input class="form-control"
                       type="text"
                       name="name"
                       value="{{ plant.name }}">
            </div>

<div class="mb-3">

    <label class="form-label">
        Category
    </label>

    <select
        class="form-select"
        name="category_id"
        required>

        {% for category in categories %}

        <option
            value="{{ category.id }}"
            {% if plant.category_id == category.id %}selected{% endif %}>

            {{ category.name }}

        </option>

        {% endfor %}

    </select>

</div>

            <div class="mb-3">
                <label class="form-label">Price</label>
                <input class="form-control"
                       type="number"
                       step="0.01"
                       name="price"
                       value="{{ plant.price }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Quantity</label>
                <input class="form-control"
                       type="number"
                       name="quantity"
                       value="{{ plant.quantity }}">
            </div>
            <div class="mb-3">
    <label class="form-label">Current Image</label><br>

    {% if plant.image %}
        <img
            src="{{ url_for('static', filename='uploads/' + plant.image) }}"
            width="120"
            class="img-thumbnail mb-2">
    {% else %}
        <p>No Image</p>
    {% endif %}
</div>

<div class="mb-3">
    <label class="form-label">Upload New Image</label>

    <input
        type="file"
        class="form-control"
        name="image"
        accept="image/*">
</div>

            <button class="btn btn-warning">
                Update Plant
            </button>

            <a href="{{ url_for('plants.plant_list') }}" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
