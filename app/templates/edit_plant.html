<!DOCTYPE html>
<html>
<head>
    <title>Edit Plant</title>
</head>
<body>

<h1>Edit Plant</h1>

<form method="POST">

<label>Plant Name</label><br>
<input type="text" name="name" value="{{ plant.name }}"><br><br>

<label>Category</label><br>
<input type="text" name="category" value="{{ plant.category }}"><br><br>

<label>Price</label><br>
<input type="number" step="0.01" name="price" value="{{ plant.price }}"><br><br>

<label>Quantity</label><br>
<input type="number" name="quantity" value="{{ plant.quantity }}"><br><br>

<button type="submit">Update Plant</button>
<br><br>

<a href="{{ url_for('plants.plant_list') }}">← Back to Plant List</a>

</form>

</body>
</html>
