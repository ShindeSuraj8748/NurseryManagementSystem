{% extends "base.html" %}

{% block title %}
Plant Details
{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-success text-white">
        <h3>{{ plant.name }}</h3>
    </div>

    <div class="card-body">

        <div class="row">

            <div class="col-md-4">

                {% if plant.image %}

                    <img
                        src="{{ url_for('static', filename='uploads/' + plant.image) }}"
                        class="img-fluid rounded">

                {% else %}

                    <img
                        src="https://placehold.co/300x300?text=No+Image"
                        class="img-fluid rounded">

                {% endif %}

            </div>

            <div class="col-md-8">

                <table class="table">

                    <tr>
                        <th>Name</th>
                        <td>{{ plant.name }}</td>
                    </tr>

                    <tr>
                        <th>Category</th>
                        <td>{{ plant.category }}</td>
                    </tr>

                    <tr>
                        <th>Price</th>
                        <td>₹ {{ plant.price }}</td>
                    </tr>

                    <tr>
                        <th>Quantity</th>
                        <td>{{ plant.quantity }}</td>
                    </tr>

                </table>

                <a
                    href="{{ url_for('plants.edit_plant', id=plant.id) }}"
                    class="btn btn-warning">

                    Edit

                </a>

                <a
                    href="{{ url_for('plants.plant_list') }}"
                    class="btn btn-secondary">

                    Back

                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
