{% extends "base.html" %}

{% block title %}
Seed Companies
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">

    <h2>Seed Companies</h2>

    <a href="{{ url_for('company.add_company') }}"
       class="btn btn-success">
        + Add Company
    </a>

</div>

<form method="GET" class="mb-3">

    <div class="input-group">

        <input
            type="text"
            class="form-control"
            name="search"
            placeholder="Search company..."
            value="{{ search }}">

        <button class="btn btn-primary">
            Search
        </button>

        <a href="{{ url_for('company.company_list') }}"
           class="btn btn-secondary">
            Clear
        </a>

    </div>

</form>

<table class="table table-bordered table-hover">

    <thead class="table-success">

    <tr>
        <th>ID</th>
        <th>Company Name</th>
        <th width="180">Action</th>
    </tr>

    </thead>

    <tbody>

    {% for company in companies %}

    <tr>

        <td>{{ company.id }}</td>

        <td>{{ company.name }}</td>

        <td>

            <a
                href="{{ url_for('company.edit_company', id=company.id) }}"
                class="btn btn-warning btn-sm">
                Edit
            </a>

            <a
                href="{{ url_for('company.delete_company', id=company.id) }}"
                class="btn btn-danger btn-sm"
                onclick="return confirm('Delete this company?')">
                Delete
            </a>

        </td>

    </tr>

    {% endfor %}

    </tbody>

</table>

{% endblock %}
