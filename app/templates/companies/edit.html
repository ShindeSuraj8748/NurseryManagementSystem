{% extends "base.html" %}

{% block title %}
Edit Company
{% endblock %}

{% block content %}

<h2 class="mb-4">
    Edit Seed Company
</h2>

<form method="POST">

    <div class="mb-3">

        <label class="form-label">
            Company Name
        </label>

        <input
            type="text"
            name="name"
            class="form-control"
            value="{{ company.name }}"
            required>

    </div>

    <button class="btn btn-warning">
        Update
    </button>

    <a
        href="{{ url_for('company.company_list') }}"
        class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
