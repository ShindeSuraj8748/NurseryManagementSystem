{% extends "base.html" %}

{% block title %}
Add Production Batch
{% endblock %}

{% block content %}

<div class="card">

    <div class="card-header bg-success text-white">

        <h3>Add Production Batch</h3>

    </div>

    <div class="card-body">

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Plant
                </label>

                <select
                    class="form-select"
                    name="plant_id"
                    id="plant"
                    required>

                    <option value="">
                        Select Plant
                    </option>

                    {% for plant in plants %}

                    <option value="{{ plant.id }}">
                        {{ plant.name }}
                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Variety
                </label>

                <select
                    class="form-select"
                    name="variety_id"
                    id="variety"
                    required>

                    <option value="">
                        Select Variety
                    </option>

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Tray Size
                </label>

                <select
                    class="form-select"
                    name="tray_size_id"
                    id="tray"
                    required>

                    {% for tray in tray_sizes %}

                    <option
                        value="{{ tray.id }}"
                        data-count="{{ tray.plant_count }}">

                        {{ tray.name }} ({{ tray.plant_count }} plants)

                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Number of Trays
                </label>

                <input
                    type="number"
                    class="form-control"
                    id="trayCount"
                    name="number_of_trays"
                    min="1"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Estimated Plants
                </label>

                <input
                    type="number"
                    class="form-control"
                    id="estimatedPlants"
                    readonly>

            </div>
            <div class="mb-3">
    <label>Selling Price (Per Plant)</label>

    <input
        type="number"
        step="0.01"
        name="selling_price"
        class="form-control"
        required>
</div>

            <div class="mb-3">

                <label class="form-label">
                    Sowing Date
                </label>

                <input
                    type="date"
                    class="form-control"
                    name="sowing_date"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Remarks
                </label>

                <textarea
                    class="form-control"
                    rows="3"
                    name="remarks"></textarea>

            </div>

            <button class="btn btn-success">

                Save Batch

            </button>

            <a
                href="{{ url_for('batches.batch_list') }}"
                class="btn btn-secondary">

                Back

            </a>

        </form>

    </div>

</div>

<script>

const plant = document.getElementById("plant");
const variety = document.getElementById("variety");

plant.addEventListener("change", function(){

    fetch("/api/varieties/" + this.value)

    .then(response => response.json())

    .then(data => {

        variety.innerHTML =
        '<option value="">Select Variety</option>';

        data.forEach(function(v){

            variety.innerHTML +=
            `<option value="${v.id}">
                ${v.name}
            </option>`;

        });

    });

});

const tray = document.getElementById("tray");

const trayCount = document.getElementById("trayCount");

const estimatedPlants =
document.getElementById("estimatedPlants");

function calculatePlants(){

    const count =
    tray.options[tray.selectedIndex]
        .dataset.count;

    const trays =
    trayCount.value || 0;

    estimatedPlants.value =
    count * trays;

}

tray.addEventListener(
    "change",
    calculatePlants
);

trayCount.addEventListener(
    "input",
    calculatePlants
);

</script>

{% endblock %}
